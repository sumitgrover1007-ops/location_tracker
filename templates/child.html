<!DOCTYPE html>
<html>
<head>
    <title>Child Role</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <h1>Child View</h1>
        <p>Logged in as family: <strong>{{ username }}</strong></p>
        <p id="status">Getting location...</p>
        
        <p><a href="/logout" class="button-link">Logout</a></p>
    </div>
    
    <script>
        let lastLat = null;
        let lastLng = null;
        let lastAccuracy = null;

        // Fixes with an error radius bigger than this (in meters) are ignored.
        // Raise it (e.g. 50) if you test indoors and nothing gets through.
        const MAX_ACCURACY_METERS = 30;

        function sendLocation(position) {
            const accuracy = position.coords.accuracy; // error radius in meters

            // Skip poor readings instead of sending them to the parent
            if (accuracy > MAX_ACCURACY_METERS) {
                document.getElementById('status').innerText =
                    `Waiting for a better GPS fix (±${Math.round(accuracy)} m)...`;
                return;
            }

            lastLat = position.coords.latitude;
            lastLng = position.coords.longitude;
            lastAccuracy = accuracy;
            updateServer();
        }

        function updateServer() {
            if (lastLat === null || lastLng === null) return;
            
            document.getElementById('status').innerText =
                `Location sent: ${lastLat.toFixed(6)}, ${lastLng.toFixed(6)} (±${Math.round(lastAccuracy)} m)`;
            
            fetch('/update_location', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lastLat, lng: lastLng, accuracy: lastAccuracy })
            });
        }

        function error() {
            document.getElementById('status').innerText = 'Unable to retrieve your location. Please enable location permissions.';
        }

        if (navigator.geolocation) {
            // watchPosition only fires when location changes.
            navigator.geolocation.watchPosition(sendLocation, error, {
                enableHighAccuracy: true,
                maximumAge: 0,     // never reuse an old cached position
                timeout: 15000
            });
            // Send heartbeat every 3 seconds so parent knows we are still active and sharing
            setInterval(updateServer, 3000);
        } else {
            document.getElementById('status').innerText = 'Geolocation not supported by this browser.';
        }
    </script>
</body>
</html>
